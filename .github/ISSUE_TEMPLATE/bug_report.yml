name: Bug report
description: Report a ReVolta problem with a reproducible configuration.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Support scope.** ReVolta is built for four or more NVIDIA V100 32 GB GPUs and validated on four, with tensor parallel 4 and decode context parallel 2 (TP4 + DCP2). We recommend and test two interconnects: NVLink, or all GPUs under one PCIe switch with P2P. The supported forms are Qwen3.8 Flash-Next AWQ or NVFP4 checkpoints, with MTP (including dynamic speculative decoding) or DFlash2, and with the KV cache on the GPUs or in host memory (Host KV). The [support matrix](https://github.com/Leonccaa/ReVolta/blob/main/docs/known-limits.md#support-matrix) lists the tested configurations.

        Other GPU counts, V100 16 GB, other models and other topologies are handled on a best-effort basis. Other GPU architectures, ROCm, CPU, XPU, TPU and GGUF are not built.

        Remove credentials, tokens and private paths from logs. Report security vulnerabilities through private vulnerability reporting ([SECURITY.md](https://github.com/Leonccaa/ReVolta/blob/main/SECURITY.md)), not in a public issue. To share test results without a problem, use the Report template.
  - type: dropdown
    id: scope
    attributes:
      label: Support scope
      description: Does your configuration match the support matrix?
      options:
        - Supported configuration
        - Other configuration (best effort)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction
      description: Expected behavior, actual behavior and minimal steps, including the failing request if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReVolta version
      description: Output of `vllm --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker image (ghcr.io/leonccaa/revolta)
        - PyPI wheel (pip install revolta)
        - Built from source
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model, count and memory per GPU
      placeholder: 4 x Tesla V100-PCIE-32GB
    validations:
      required: true
  - type: dropdown
    id: interconnect
    attributes:
      label: GPU interconnect
      options:
        - NVLink
        - All GPUs under one PCIe switch, P2P enabled
        - PCIe without P2P, or P2P disabled
        - Other (describe in the reproduction)
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Output of `nvidia-smi topo -m`
      render: text
    validations:
      required: true
  - type: input
    id: host-memory
    attributes:
      label: Host memory, container memory limit and /dev/shm size
      placeholder: 128 GiB host, 128 GiB container limit, 128 GiB shm
    validations:
      required: true
  - type: dropdown
    id: weights
    attributes:
      label: Weight format
      options:
        - AWQ g32
        - Standard NVFP4
        - NVIDIA FP4-Local
        - NVIDIA NVFP4-QAD
        - Hy4-flash AWQ g32 (validation support)
        - Other model or format (describe in the reproduction)
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint repository and revision
      placeholder: <owner>/<repository> @ <revision>
    validations:
      required: true
  - type: dropdown
    id: speculative
    attributes:
      label: Speculative decoding
      options:
        - MTP with a fixed number of draft tokens
        - MTP with dynamic speculative decoding (num_speculative_tokens_per_batch_size)
        - DFlash2
        - None
    validations:
      required: true
  - type: dropdown
    id: kv-placement
    attributes:
      label: KV cache placement
      options:
        - GPU KV (default)
        - Host KV (--kernel-config long_context_kv enabled)
    validations:
      required: true
  - type: dropdown
    id: kv-dtype
    attributes:
      label: KV cache dtype (--kv-cache-dtype)
      options:
        - auto (default; INT8 on V100)
        - int8 / int8_per_token_head
        - fp8_per_token_head
        - fp8 / fp8_e4m3 (calibrated scales)
        - float16
        - Other (describe in the reproduction)
    validations:
      required: true
  - type: dropdown
    id: offload
    attributes:
      label: KV offload mode
      options:
        - "Off"
        - CPU
        - CPU + disk tier
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Complete launch command and environment variables
      description: Include --speculative-config, --kernel-config and --kv-transfer-config, and every VLLM_*, NCCL_* and PYTORCH_* variable you set.
      render: shell
    validations:
      required: true
  - type: textarea
    id: startup
    attributes:
      label: Startup log lines
      description: The `ReVolta profile {...}` line, the `SM70 interconnect=` line from each worker, and the `GPU KV cache size` line (with Host KV, the `long-context KV worker=0 ...` line instead).
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker image tag or wheel file, OS, Python, torch, CUDA and NVIDIA driver versions.
      placeholder: ghcr.io/leonccaa/revolta:0.2.0, Ubuntu 22.04, NVIDIA driver 570.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
