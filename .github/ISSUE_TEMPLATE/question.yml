name: Question or feature request
description: Ask how to use ReVolta, or propose a feature or a change to the supported scope.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: "For a crash, wrong output or another defect, use the bug report form instead. Please search existing issues first. Supported hardware, models and configurations are listed in [Support and known limits](https://github.com/Leonccaa/ReVolta/blob/main/docs/known-limits.md#support-matrix)."
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Question
        - Feature request
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Question or request
      description: What do you want to do, and what have you tried? For a feature, describe the use case it serves.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup (if relevant)
      description: ReVolta version, install method (Docker image, PyPI or source), GPUs and interconnect, checkpoint, and the launch command.
      render: text
