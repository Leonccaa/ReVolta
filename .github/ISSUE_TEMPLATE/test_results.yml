name: Test results
description: Share speed, capacity or stability results measured on your hardware. Nothing needs to be broken.
title: "Test results: "
labels: ["test results"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing results. Data from configurations we have not validated (NVLink, other GPU counts, V100 16 GB, other hosts) is especially useful.

        To compare with the release tables, see the method in [docs/performance.md](https://github.com/Leonccaa/ReVolta/blob/main/docs/performance.md#reference-system-mtp4). Any method is welcome; please describe the one you used so the numbers can be read correctly.

        For a problem or a crash, use the bug report form instead. Remove credentials, tokens and private paths from commands and logs.
  - type: input
    id: version
    attributes:
      label: ReVolta version and installation method
      placeholder: 0.1.3, PyPI wheel (cp312)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU model, count, memory per GPU and power limit
      placeholder: 4 x Tesla V100-SXM2 32 GB, 250 W
    validations:
      required: true
  - type: dropdown
    id: interconnect
    attributes:
      label: GPU interconnect
      options:
        - PCIe switch with P2P
        - PCIe without P2P
        - NVLink
        - Other (describe in the notes)
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Output of `nvidia-smi topo -m`
      render: text
    validations:
      required: true
  - type: input
    id: host-memory
    attributes:
      label: Host memory, container memory limit and /dev/shm size
      placeholder: 128 GiB host, no container, 63 GiB shm
  - type: input
    id: checkpoints
    attributes:
      label: Target and draft checkpoints with revisions
      placeholder: <owner>/<repository> @ <revision>; drafter <owner>/<repository> @ <revision>
    validations:
      required: true
  - type: dropdown
    id: speculative
    attributes:
      label: Speculative decoding method
      options:
        - MTP
        - DFlash2
        - None
        - Other (describe in the notes)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Complete launch command and environment variables
      description: Include --speculative-config and --kv-transfer-config, and every VLLM_*, NCCL_* and PYTORCH_* variable you set.
      render: shell
    validations:
      required: true
  - type: textarea
    id: startup
    attributes:
      label: Startup log lines
      description: The `ReVolta profile {...}` line, the `SM70 interconnect=` lines and the `GPU KV cache size` line.
      render: text
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: How you measured
      description: Prompts, response length, thinking on or off, temperature, number of concurrent requests, repetitions, and whether rates include the time to first token.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Tables are welcome. Give the unit of every number.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Stability, deviations from the README and other notes
